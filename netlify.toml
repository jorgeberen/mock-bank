[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs Node ^20.19 or >=22.12
  NODE_VERSION = "22"

# SPA fallback: serve index.html for client-side routes (/analyzer, unknown URLs -> app 404 page)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
